# Optional Render Blueprint. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: zuno-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "true" }
      - { key: MONGODB_URI, sync: false }
      - { key: JWT_SECRET, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: BACKEND_URL, sync: false }
      - { key: PLATFORM_PAYSTACK_SECRET_KEY, sync: false }
      - { key: GATEWAY_ENCRYPTION_KEY, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: EMAIL_FROM, sync: false }
